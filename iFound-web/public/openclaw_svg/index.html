<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0a0f1d;
        }

        .h-full {
            height: 90%;
        }

        .w-full {
            width: 100%;
        }

        .agent-group {
            transition: filter 0.3s ease;
        }

        .agent-group:hover {
            cursor: pointer;
        }

        .agent-a:hover {
            filter: url(#glow-a);
        }

        .agent-b:hover {
            filter: url(#glow-b);
        }

        .agent-c:hover {
            filter: url(#glow-c);
        }

        .agent-d:hover {
            filter: url(#glow-d);
        }

        .agent-e:hover {
            filter: url(#glow-e);
        }

        .agent-f:hover {
            filter: url(#glow-f);
        }

        .info-card {
            position: fixed;
            display: none;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            min-width: 220px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .info-card.show {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .info-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }

        .info-card-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
        }

        .info-card-name {
            color: #e5e7eb;
            font-size: 16px;
            font-weight: 600;
        }

        .info-card-role {
            color: #9ca3af;
            font-size: 12px;
        }

        .info-card-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .info-card-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-card-label {
            color: #9ca3af;
            font-size: 12px;
        }

        .info-card-value {
            color: #e5e7eb;
            font-size: 12px;
            font-weight: 500;
        }

        .status-badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
        }

        .status-resting {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-meeting {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .status-working {
            background: rgba(234, 179, 8, 0.2);
            color: #eab308;
            border: 1px solid rgba(234, 179, 8, 0.3);
        }

        .status-moving {
            background: rgba(168, 85, 247, 0.2);
            color: #a855f7;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #334155;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 4px;
        }

        .progress-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .info-card-footer {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #334155;
            display: flex;
            gap: 8px;
        }

        .info-card-btn {
            flex: 1;
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .info-card-btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }

        .info-card-btn-primary:hover {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
        }

        .info-card-btn-secondary {
            background: #334155;
            color: #9ca3af;
        }

        .info-card-btn-secondary:hover {
            background: #475569;
            color: #e5e7eb;
        }
    </style>
</head>

        // 生成代码滚动动画
        function generateCodeAnimation(containerId, config) {
            const container = document.getElementById(containerId);
            if (!container) return;

            const svgNS = 'http://www.w3.org/2000/svg';

            // 创建clipPath
            const clipPath = document.createElementNS(svgNS, 'clipPath');
            clipPath.setAttribute('id', `screen-clip-${config.id}`);
            const clipRect = document.createElementNS(svgNS, 'rect');
            clipRect.setAttribute('x', '8');
            clipRect.setAttribute('y', '8');
            clipRect.setAttribute('width', '164');
            clipRect.setAttribute('height', '94');
            clipPath.appendChild(clipRect);
            container.appendChild(clipPath);

            // 创建clipPath组
            const clipGroup = document.createElementNS(svgNS, 'g');
            clipGroup.setAttribute('clip-path', `url(#screen-clip-${config.id})`);

            // 创建内容组
            const contentGroup = document.createElementNS(svgNS, 'g');

            // 计算总行数（原始 + 重复）
            const totalLines = config.lines.length * 2;
            let y = 20;

            // 生成两份代码内容（用于无缝滚动）
            for (let repeat = 0; repeat < 2; repeat++) {
                config.lines.forEach(line => {
                    line.forEach(token => {
                        const text = document.createElementNS(svgNS, 'text');
                        text.setAttribute('x', token.x);
                        text.setAttribute('y', y);
                        text.setAttribute('fill', token.color);
                        text.setAttribute('font-size', '6');
                        text.setAttribute('font-family', 'monospace');
                        text.textContent = token.text;
                        contentGroup.appendChild(text);
                    });
                    y += 12;
                });
            }

            // 添加动画
            const animate = document.createElementNS(svgNS, 'animateTransform');
            animate.setAttribute('attributeName', 'transform');
            animate.setAttribute('type', 'translate');
            animate.setAttribute('values', `0,0;0,${config.translate}`);
            animate.setAttribute('dur', `${config.duration}s`);
            animate.setAttribute('repeatCount', 'indefinite');
            contentGroup.appendChild(animate);

            clipGroup.appendChild(contentGroup);
            container.appendChild(clipGroup);
        }

        // 页面加载后生成所有代码动画

        // 解析路径，提取所有坐标点
        function parsePathPoints(pathId) {
            const path = document.getElementById(pathId);
            if (!path) return [];
            const d = path.getAttribute('d');
            if (!d) return [];
            const points = [];
            // 使用正则表达式匹配所有坐标点
            const regex = /([ML])\s*([\d.]+),([\d.]+)/g;
            let match;
            while ((match = regex.exec(d)) !== null) {
                points.push({ x: parseFloat(match[2]), y: parseFloat(match[3]) });
            }
            return points;
        }

        // 计算路径总长度
        function calculatePathLength(pathId) {
            const path = document.getElementById(pathId);
            if (!path) return 0;
            return path.getTotalLength();
        }

        // 反转路径，生成新的路径字符串
        function reversePath(pathId) {
            const points = parsePathPoints(pathId);
            if (points.length === 0) return null;
            // 反转点的顺序
            points.reverse();
            // 构建新的路径字符串
            let newD = `M ${points[0].x},${points[0].y}`;
            for (let i = 1; i < points.length; i++) {
                newD += ` L ${points[i].x},${points[i].y}`;
            }
            return newD;
        }

        // 根据当前位置和目标位置，确定需要的路径
        function getRequiredPath(currentLocation, targetLocation, paths) {
            // 路径映射关系：
            // X_to_M: 休息区到忙碌区
            // X_to_H: 休息区到会议区
            // X_to_B: 休息区到办公区
            // H_to_M: 会议区到忙碌区
            // B_to_H: 办公区到会议区
            // B_to_M: 办公区到忙碌区
            const prefix = paths[0].split('_').slice(0, 2).join('_'); // 例如: ag_a

            if (currentLocation === 'X') {
                // 当前在休息区
                if (targetLocation === 'M') {
                    return { pathId: `${prefix}_X_to_M`, isReversed: false };
                } else if (targetLocation === 'H') {
                    return { pathId: `${prefix}_X_to_H`, isReversed: false };
                } else if (targetLocation === 'B') {
                    return { pathId: `${prefix}_X_to_B`, isReversed: false };
                }
            } else if (currentLocation === 'M') {
                // 当前在忙碌区
                if (targetLocation === 'X') {
                    return { pathId: `${prefix}_X_to_M`, isReversed: true };
                } else if (targetLocation === 'H') {
                    return { pathId: `${prefix}_H_to_M`, isReversed: true };
                } else if (targetLocation === 'B') {
                    return { pathId: `${prefix}_B_to_M`, isReversed: true };
                }
            } else if (currentLocation === 'H') {
                // 当前在会议区
                if (targetLocation === 'M') {
                    return { pathId: `${prefix}_H_to_M`, isReversed: false };
                } else if (targetLocation === 'X') {
                    return { pathId: `${prefix}_X_to_H`, isReversed: true };
                } else if (targetLocation === 'B') {
                    return { pathId: `${prefix}_B_to_H`, isReversed: true };
                }
            } else if (currentLocation === 'B') {
                // 当前在办公区
                if (targetLocation === 'M') {
                    return { pathId: `${prefix}_B_to_M`, isReversed: false };
                } else if (targetLocation === 'H') {
                    return { pathId: `${prefix}_B_to_H`, isReversed: false };
                } else if (targetLocation === 'X') {
                    return { pathId: `${prefix}_X_to_B`, isReversed: true };
                }
            }
            return null;
        }

        // 变更agent的移动路径
        function changeAgentPath(agentInfo) {
            // 获取animateMotion元素
            const animElement = document.getElementById(agentInfo.id);
            if (!animElement) return;

            // 定义目标位置（排除当前位置）
            const locations = ['X', 'M', 'H', 'B'];
            const otherLocations = locations.filter(loc => loc !== agentInfo.currentLocation);

            // 随机选择一个目标位置
            const targetLocation = otherLocations[Math.floor(Math.random() * otherLocations.length)];

            // 获取需要的路径信息
            const pathInfo = getRequiredPath(agentInfo.currentLocation, targetLocation, agentInfo.paths);
            if (!pathInfo) return;

            // 检查路径是否真实存在（防止Agent D/E/F选择B位置时路径不存在）
            const pathElement = document.getElementById(pathInfo.pathId);
            if (!pathElement) return;

            // 获取animateMotion的父元素（g元素）
            const gElement = animElement.parentElement;

            // 移除初始位置的transform，让animateMotion接管位置
            if (gElement && gElement.hasAttribute('transform')) {
                gElement.removeAttribute('transform');
            }

            // 计算路径长度，决定动画时长
            const pathLength = calculatePathLength(pathInfo.pathId);
            // 根据路径长度计算动画时长：
            // 默认6s，600~700为6s，700~800为7s，依次类推，最高13s
            let animDuration = 6;
            if (pathLength >= 600) {
                // 计算百位数，例如700~800的百位数是7，对应7s
                animDuration = Math.min(13, Math.floor(pathLength / 100));
            }

            // 获取mpath元素
            const mpath = animElement.querySelector('mpath');
            if (!mpath) return;

            if (pathInfo.isReversed) {
                // 需要反向路径，生成临时路径
                const reversedD = reversePath(pathInfo.pathId);
                if (reversedD) {
                    // 创建或获取临时路径元素
                    const tempPathId = `temp_${agentInfo.id}`;
                    let tempPath = document.getElementById(tempPathId);
                    if (!tempPath) {
                        tempPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        tempPath.setAttribute('id', tempPathId);
                        tempPath.setAttribute('stroke', '#aaa');
                        tempPath.setAttribute('stroke-width', '0');
                        tempPath.setAttribute('fill', 'none');
                        animElement.closest('svg').appendChild(tempPath);
                    }
                    tempPath.setAttribute('d', reversedD);
                    mpath.setAttribute('href', `#${tempPathId}`);
                }
            } else {
                // 正向路径，直接使用原路径
                mpath.setAttribute('href', `#${pathInfo.pathId}`);
            }

            // 更新动画时长
            animElement.setAttribute('dur', `${animDuration}s`);

            // 更新agent的状态
            agentInfo.currentPath = pathInfo.pathId;
            agentInfo.currentLocation = targetLocation;
            agentInfo.isReversed = pathInfo.isReversed;

            // 设置为移动中状态
            agentInfo.status = 'moving';
            updateAgentStatusTag(agentInfo.id, 'moving');

            // 重新启动动画
            animElement.beginElement();

            // 动画结束后更新状态
            setTimeout(() => {
                // 根据位置确定状态
                if (agentInfo.currentLocation === 'X') {
                    agentInfo.status = 'resting';
                } else if (agentInfo.currentLocation === 'H') {
                    agentInfo.status = 'meeting';
                } else if (agentInfo.currentLocation === 'B') {
                    agentInfo.status = 'working';
                } else {
                    agentInfo.status = 'working';
                }
                updateAgentStatusTag(agentInfo.id, agentInfo.status);
            }, animDuration * 1000);
        }

        // 每15秒执行一次路径变更
        setInterval(() => {
            startAgentAnimation();
        }, 15000);
        startAgentAnimation();
        function startAgentAnimation() {
            agents.forEach(agentInfo => {
                changeAgentPath(agentInfo);
            });
        }
        // 更新时钟
        function updateClock() {
            const now = new Date();
            const hours = now.getHours() % 12;
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            // 计算角度
            const hourAngle = (hours * 30) + (minutes * 0.5);
            const minuteAngle = minutes * 6;
            const secondAngle = seconds * 6;

            // 获取指针元素
            const hourHand = document.getElementById('hour-hand');
            const minuteHand = document.getElementById('minute-hand');
            const secondHand = document.getElementById('second-hand');

            // 设置旋转（围绕中心点40,40旋转）
            hourHand.setAttribute('transform', `rotate(${hourAngle}, 40, 40)`);
            minuteHand.setAttribute('transform', `rotate(${minuteAngle}, 40, 40)`);
            secondHand.setAttribute('transform', `rotate(${secondAngle}, 40, 40)`);
        }

        // 初始化时钟并每秒更新
        updateClock();
        setInterval(updateClock, 1000);

        // ==================== Agent信息卡片功能 ====================
        const infoCard = document.getElementById('agentInfoCard');
        let currentAgentId = null;

        // 获取位置名称
        function getLocationName(location) {
            const locationMap = {
                'X': '休息区',
                'M': '忙碌区',
                'H': '会议区'
            };
            return locationMap[location] || '未知';
        }

        // 获取状态名称和样式
        function getStatusInfo(status) {
            const statusMap = {
                'resting': { text: '休息中', class: 'status-resting' },
                'working': { text: '工作中', class: 'status-working' },
                'meeting': { text: '会议中', class: 'status-meeting' },
                'moving': { text: '移动中', class: 'status-moving' }
            };
            return statusMap[status] || { text: '未知', class: 'status-resting' };
        }

        // 生成星级
        function getStarRating(level) {
            let stars = '';
            for (let i = 0; i < 5; i++) {
                stars += i < level ? '⭐' : '☆';
            }
            return stars;
        }

        // 显示信息卡片
        function showInfoCard(agentId, event) {
            const agent = agents.find(a => a.id === agentId);
            if (!agent) return;

            currentAgentId = agentId;

            // 更新卡片内容
            document.getElementById('cardAvatar').textContent = agent.name.replace('Agent ', '');
            document.getElementById('cardAvatar').style.background = agent.color;
            document.getElementById('cardName').textContent = agent.name;
            document.getElementById('cardRole').textContent = agent.role;

            const statusInfo = getStatusInfo(agent.status);
            const statusBadge = document.getElementById('cardStatus');
            statusBadge.textContent = statusInfo.text;
            statusBadge.className = 'status-badge ' + statusInfo.class;

            document.getElementById('cardLocation').textContent = getLocationName(agent.currentLocation);
            document.getElementById('cardTasks').textContent = `${agent.tasks.completed} / ${agent.tasks.total}`;
            document.getElementById('cardEfficiency').textContent = `${agent.efficiency}%`;
            document.getElementById('cardProgress').textContent = `${agent.progress}%`;
            document.getElementById('cardProgressBar').style.width = `${agent.progress}%`;
            document.getElementById('cardOnlineTime').textContent = agent.onlineTime;
            document.getElementById('cardLevel').textContent = getStarRating(agent.level);

            // 设置卡片位置
            const rect = event.target.closest('.agent-group').getBoundingClientRect();
            const cardWidth = 240;
            const cardHeight = 320;

            let left = rect.right + 10;
            let top = rect.top;

            // 防止超出屏幕右侧
            if (left + cardWidth > window.innerWidth) {
                left = rect.left - cardWidth - 10;
            }

            // 防止超出屏幕底部
            if (top + cardHeight > window.innerHeight) {
                top = window.innerHeight - cardHeight - 10;
            }

            infoCard.style.left = left + 'px';
            infoCard.style.top = top + 'px';
            infoCard.classList.add('show');
        }

        // 关闭信息卡片
        function closeInfoCard() {
            infoCard.classList.remove('show');
            currentAgentId = null;
        }

        // 查看详情
        function viewDetails() {
            if (currentAgentId) {
                alert(`查看 ${agents.find(a => a.id === currentAgentId)?.name} 的详细信息`);
            }
        }

        // 更新Agent状态标签
        function updateAgentStatusTag(agentId, status) {
            const agentGroup = document.querySelector(`[id="${agentId}"]`)?.closest('.agent-group');
            if (!agentGroup) return;

            const statusTag = agentGroup.querySelector('.status-tag');
            if (!statusTag) return;

            const statusInfo = getStatusInfo(status);
            const rect = statusTag.querySelector('rect');
            const text = statusTag.querySelector('text');

            // 更新颜色
            const colorMap = {
                'meeting': { fill: 'rgba(59, 130, 246, 0.2)', stroke: 'rgba(59, 130, 246, 0.4)', text: '#3b82f6' },
                'resting': { fill: 'rgba(34, 197, 94, 0.2)', stroke: 'rgba(34, 197, 94, 0.4)', text: '#22c55e' },
                'working': { fill: 'rgba(234, 179, 8, 0.2)', stroke: 'rgba(234, 179, 8, 0.4)', text: '#eab308' },
                'moving': { fill: 'rgba(168, 85, 247, 0.2)', stroke: 'rgba(168, 85, 247, 0.4)', text: '#a855f7' }
            };

            const colors = colorMap[status] || colorMap['resting'];
            rect.setAttribute('fill', colors.fill);
            rect.setAttribute('stroke', colors.stroke);
            text.setAttribute('fill', colors.text);
            text.textContent = statusInfo.text;
        }

        // 为每个Agent添加点击事件
        document.querySelectorAll('.agent-group').forEach((group, index) => {
            group.addEventListener('click', (e) => {
                e.stopPropagation();
                const agentId = agents[index]?.id;
                if (agentId) {
                    showInfoCard(agentId, e);
                }
            });
        });

        // 点击页面其他地方关闭卡片
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.info-card') && !e.target.closest('.agent-group')) {
                closeInfoCard();
            }
        });
